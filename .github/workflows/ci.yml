name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  SOLUTION_PATH: MyFhirSdk.sln

jobs:
  kernel-migration-baseline:
    name: Rebuild K0 migration baseline
    runs-on: windows-latest
    steps:
      - name: Checkout fixture and pinned history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pinned .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test K0 metadata and locale isolation, fixture pin and failure evidence
        shell: pwsh
        run: ./eng/Test-KernelMigrationHarnessExitCode.ps1
      - name: Rebuild baseline and run consumer, regression and smoke gates
        shell: pwsh
        run: ./eng/Test-KernelMigrationBaseline.ps1 -RunRegressionAndSmoke
      - name: Verify whole-source rollback against the restored historical solution
        shell: pwsh
        run: ./eng/Test-KernelSourceRollback.ps1 -BaselineDirectory artifacts/kernel-k0
      - name: Verify rollback rejection and failure evidence
        shell: pwsh
        run: ./eng/Test-KernelSourceRollbackHarness.ps1
      - name: Upload K0 evidence and reproducible binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-k0-evidence
          path: |
            artifacts/kernel-k0/*.txt
            artifacts/kernel-k0/*.json
            artifacts/kernel-k0/old-consumer
            artifacts/kernel-k0/current-consumer
            artifacts/kernel-k0/test-results
            artifacts/kernel-k0/primitive-equivalence
            artifacts/kernel-k0/smoke
            artifacts/kernel-k0-harness-tests/*.json
            artifacts/kernel-k7/rollback/*.json
            artifacts/kernel-k7/rollback/*.log
            artifacts/kernel-k7/rollback/test-results
            artifacts/kernel-k7/rollback/current-test-results
            artifacts/kernel-k7/rollback-harness
          if-no-files-found: warn

  compiler-reference-asset:
    name: Build canonical compiler reference asset
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate toolchain contract
        shell: pwsh
        run: ./eng/Test-CodeGenToolchainContract.ps1 -OutputPath artifacts/toolchain/toolchain-contract.json

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build compiler reference asset
        run: dotnet build eng/MyFhirSdk.CodeGen.Build.proj --configuration Release --no-restore

      - name: Verify compiler contract preserves normal SDK build outputs
        shell: pwsh
        run: ./eng/Test-CompilerReferenceIsolation.ps1 -OutputPath artifacts/toolchain/compiler-isolation-summary.json

      - name: Stage compiler reference asset
        shell: pwsh
        run: |
          [xml] $props = Get-Content -LiteralPath Directory.Build.props -Raw
          $tfm = [string] $props.Project.PropertyGroup.MyFhirSdkTargetFramework
          $source = "CodeGen/bin/Release/$tfm/Assets/RuntimeReferences/$tfm/MyFhirSdk.Runtime.dll"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Compiler reference asset was not staged at $source."
          }
          $destination = "artifacts/compiler-reference/$tfm"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination "$destination/MyFhirSdk.Runtime.dll"

      - name: Upload compiler reference asset
        uses: actions/upload-artifact@v4
        with:
          name: compiler-reference-asset
          path: |
            artifacts/compiler-reference
            artifacts/toolchain
          if-no-files-found: error

      - name: Pack canonical tool
        run: dotnet msbuild eng/MyFhirSdk.CodeGen.Build.proj /t:Pack /p:Configuration=Release

      - name: Upload canonical tool
        uses: actions/upload-artifact@v4
        with:
          name: canonical-tool-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  baseline-tool-package:
    name: Rebuild recorded tool upgrade baseline
    runs-on: windows-latest

    steps:
      - name: Checkout current baseline metadata
        uses: actions/checkout@v4
        with:
          path: metadata

      - name: Resolve baseline source revision
        id: baseline
        shell: pwsh
        run: |
          $baseline = Get-Content -LiteralPath metadata/eng/codegen-tool-upgrade-baseline.json -Raw | ConvertFrom-Json
          if ([string] $baseline.sourceRevision -notmatch '^[0-9a-f]{40}$') {
            throw 'Upgrade baseline must contain a full Git sourceRevision.'
          }
          "revision=$($baseline.sourceRevision)" >> $env:GITHUB_OUTPUT

      - name: Checkout recorded baseline source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.baseline.outputs.revision }}
          path: baseline-source

      - name: Setup baseline .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: baseline-source/global.json

      - name: Restore baseline source
        working-directory: baseline-source
        run: dotnet msbuild eng/MyFhirSdk.CodeGen.Build.proj /t:Restore

      - name: Pack baseline tool from recorded source
        shell: pwsh
        working-directory: baseline-source
        run: |
          # Resolve the SDK from the immutable baseline's global.json, not the
          # runner workspace (which has no global.json in this job).
          $workspace = $env:GITHUB_WORKSPACE
          $output = Join-Path $workspace artifacts/baseline-package
          dotnet msbuild eng/MyFhirSdk.CodeGen.Build.proj `
            /t:Pack `
            /p:Configuration=Release `
            "/p:PackageOutputPath=$output"
          if ($LASTEXITCODE -ne 0) {
            throw "Baseline tool pack failed with exit code $LASTEXITCODE."
          }
          $packages = @(Get-ChildItem -LiteralPath $output -Filter *.nupkg -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one baseline tool package; found $($packages.Count)."
          }
          $descriptor = Get-Content CodeGen/Policy/runtime-contract.json -Raw | ConvertFrom-Json
          & (Join-Path $workspace metadata/eng/Write-CodeGenToolPackageInventory.ps1) `
            -PackagePath $packages[0].FullName `
            -ExpectedTargetFramework $descriptor.targetFramework `
            -OutputPath (Join-Path $workspace artifacts/baseline-package-inventory.txt)
          & (Join-Path $workspace metadata/eng/Test-CodeGenToolUpgrade.ps1) `
            -CurrentPackagePath $packages[0].FullName `
            -BaselinePath (Join-Path $workspace metadata/eng/codegen-tool-upgrade-baseline.json) `
            -OutputPath (Join-Path $workspace artifacts/baseline-package-status.json)

      - name: Upload real baseline package
        uses: actions/upload-artifact@v4
        with:
          name: baseline-tool-package
          path: artifacts/baseline-package/*.nupkg
          if-no-files-found: error

  build-test-tool-smoke:
    name: Build, test and tool smoke (${{ matrix.id }})
    needs:
      - compiler-reference-asset
      - baseline-tool-package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            os: ubuntu-latest
          - id: windows
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download compiler reference asset
        uses: actions/download-artifact@v4
        with:
          name: compiler-reference-asset
          path: artifacts/compiler-reference-download

      - name: Download real baseline package
        uses: actions/download-artifact@v4
        with:
          name: baseline-tool-package
          path: artifacts/baseline-package-download

      - name: Download canonical tool package
        uses: actions/download-artifact@v4
        with:
          name: canonical-tool-package
          path: artifacts/canonical-package-download

      - name: Resolve build contract
        id: contract
        shell: pwsh
        run: |
          [xml] $props = Get-Content -LiteralPath Directory.Build.props -Raw
          $tfm = [string] $props.Project.PropertyGroup.MyFhirSdkTargetFramework
          $assets = @(Get-ChildItem -LiteralPath artifacts/compiler-reference-download -Filter MyFhirSdk.Runtime.dll -Recurse -File)
          if ($assets.Count -ne 1) {
            throw "Expected exactly one compiler reference asset; found $($assets.Count)."
          }
          "tfm=$tfm" >> $env:GITHUB_OUTPUT
          "runtime-reference=$($assets[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Rebuild consumers and verify isolated kernel deployment
        shell: pwsh
        run: ./eng/Test-KernelConsumerRebuild.ps1 -RuntimeReferenceAssetPath "${{ steps.contract.outputs.runtime-reference }}"

      - name: Verify K3 consumer discovery and regression rejection cases
        shell: pwsh
        run: ./eng/Test-KernelConsumerRebuildHarness.ps1

      - name: Upload K3 rebuild and deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-k3-${{ matrix.id }}
          path: |
            artifacts/kernel-k3
            artifacts/kernel-k3-harness
          if-no-files-found: warn

      - name: Pack local tool
        run: dotnet pack CodeGen/MyFhirSdk.CodeGen.csproj --configuration Release --no-build --no-restore -p:RuntimeReferenceAssetPath="${{ steps.contract.outputs.runtime-reference }}" --output artifacts/d7/package

      - name: Inspect package and upgrade baseline
        id: package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts/d7/package -Filter *.nupkg -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one tool package; found $($packages.Count)."
          }
          $baselinePackages = @(Get-ChildItem -LiteralPath artifacts/baseline-package-download -Filter *.nupkg -File)
          if ($baselinePackages.Count -ne 1) {
            throw "Expected exactly one baseline tool package; found $($baselinePackages.Count)."
          }
          $baseline = Get-Content -LiteralPath eng/codegen-tool-upgrade-baseline.json -Raw | ConvertFrom-Json
          [xml] $project = Get-Content -LiteralPath CodeGen/MyFhirSdk.CodeGen.csproj -Raw
          $properties = $project.SelectSingleNode('/Project/PropertyGroup[ExpectedToolPackageVersion]')
          . ./eng/SemanticVersion.ps1
          $versionComparison = Compare-MyFhirSdkSemanticVersion `
            ([string] $properties.ExpectedToolPackageVersion) `
            ([string] $baseline.baselineVersion)
          $upgradeRequired = $versionComparison -gt 0
          "path=$($packages[0].FullName)" >> $env:GITHUB_OUTPUT
          "upgrade-required=$($upgradeRequired.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $upgradeParameters = @{
            CurrentPackagePath = $packages[0].FullName
            BaselinePath = 'eng/codegen-tool-upgrade-baseline.json'
            OutputPath = 'artifacts/d7/upgrade-status.json'
          }
          if ($upgradeRequired) {
            $upgradeParameters.PreviousPackagePath = $baselinePackages[0].FullName
          }
          ./eng/Write-CodeGenToolPackageInventory.ps1 `
            -PackagePath $packages[0].FullName `
            -ExpectedTargetFramework '${{ steps.contract.outputs.tfm }}' `
            -OutputPath artifacts/d7/package-inventory.txt
          ./eng/Test-CodeGenToolUpgrade.ps1 @upgradeParameters

      - name: Clean-environment local tool smoke
        shell: pwsh
        run: |
          $smokeParameters = @{
            PackagePath = '${{ steps.package.outputs.path }}'
            ToolManifestPath = '.config/dotnet-tools.json'
            FhirPackagePath = 'Tests/CodeGen/Fixtures/FhirPackages/R5/hl7.fhir.r5.core-5.0.0.tgz'
            PrimitiveDefinitionsPath = 'Tests/CodeGen/Fixtures/StructureDefinitions/Primitives/R5'
            PrimitivePolicyPath = 'CodeGen/Policy/primitive-generation-policy.json'
            CommittedGeneratedRoot = 'Generated/R5'
            OutputDirectory = 'artifacts/d7/smoke'
          }
          if ('${{ steps.package.outputs.upgrade-required }}' -eq 'true') {
            $baselinePackage = @(Get-ChildItem -LiteralPath artifacts/baseline-package-download -Filter *.nupkg -File)
            $smokeParameters.PreviousPackagePath = $baselinePackage[0].FullName
          }
          ./eng/Invoke-CodeGenToolSmoke.ps1 @smokeParameters

      - name: Same-package cross-platform smoke
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts/canonical-package-download -Filter *.nupkg -File)
          $baseline = @(Get-ChildItem artifacts/baseline-package-download -Filter *.nupkg -File)
          if ($packages.Count -ne 1 -or $baseline.Count -ne 1) { throw 'Expected one current and one baseline package.' }
          ./eng/Invoke-CodeGenToolSmoke.ps1 `
            -PackagePath $packages[0].FullName `
            -PreviousPackagePath $baseline[0].FullName `
            -ToolManifestPath .config/dotnet-tools.json `
            -FhirPackagePath Tests/CodeGen/Fixtures/FhirPackages/R5/hl7.fhir.r5.core-5.0.0.tgz `
            -PrimitiveDefinitionsPath Tests/CodeGen/Fixtures/StructureDefinitions/Primitives/R5 `
            -PrimitivePolicyPath CodeGen/Policy/primitive-generation-policy.json `
            -CommittedGeneratedRoot Generated/R5 `
            -OutputDirectory artifacts/d7/canonical-smoke `
            -ExportGeneratedSources

      - name: Rebuild and run SDK from installed tool generated sources
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts/canonical-package-download -Filter *.nupkg -File)
          if ($packages.Count -ne 1) { throw 'Expected one canonical tool package.' }
          ./eng/Test-GeneratedSdkIntegration.ps1 `
            -SmokeDirectory artifacts/d7/canonical-smoke `
            -PackagePath $packages[0].FullName `
            -RuntimeReferenceAssetPath '${{ steps.contract.outputs.runtime-reference }}' `
            -OutputDirectory artifacts/d7/generated-sdk

      - name: Verify K6 generated input rejection cases
        shell: pwsh
        run: |
          $package = @(Get-ChildItem artifacts/canonical-package-download -Filter *.nupkg -File)[0]
          ./eng/Test-GeneratedSdkIntegrationHarness.ps1 `
            -SmokeDirectory artifacts/d7/canonical-smoke `
            -PackagePath $package.FullName `
            -RuntimeReferenceAssetPath '${{ steps.contract.outputs.runtime-reference }}' `
            -OutputDirectory artifacts/d7/generated-sdk-harness

      - name: Upload D7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d7-tool-${{ matrix.id }}
          path: |
            artifacts/d7
            !artifacts/d7/generated-sdk-harness/*/**
          if-no-files-found: warn

  cross-platform-drift:
    name: Compare Windows and Linux tool artifacts
    needs: build-test-tool-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows evidence
        uses: actions/download-artifact@v4
        with:
          name: d7-tool-windows
          path: artifacts/cross/windows

      - name: Download Linux evidence
        uses: actions/download-artifact@v4
        with:
          name: d7-tool-linux
          path: artifacts/cross/linux

      - name: Compare normalized inventories and generated hashes
        shell: pwsh
        run: |
          ./eng/Compare-CodeGenToolArtifacts.ps1 `
            -WindowsPackageInventory artifacts/cross/windows/package-inventory.txt `
            -LinuxPackageInventory artifacts/cross/linux/package-inventory.txt `
            -WindowsArtifactHashes artifacts/cross/windows/smoke/artifact-hashes.txt `
            -LinuxArtifactHashes artifacts/cross/linux/smoke/artifact-hashes.txt `
            -OutputPath artifacts/cross/cross-platform-drift.json
          $windows = Get-Content artifacts/cross/windows/canonical-smoke/smoke-summary.json -Raw | ConvertFrom-Json
          $linux = Get-Content artifacts/cross/linux/canonical-smoke/smoke-summary.json -Raw | ConvertFrom-Json
          foreach ($field in @('packageSha256', 'fhirPackageSha256', 'primitivePolicySha256')) {
            if ([string]::IsNullOrWhiteSpace([string] $windows.$field) -or $windows.$field -cne $linux.$field) {
              throw "Canonical smoke input mismatch: $field"
            }
          }
          $windowsSdk = Get-Content artifacts/cross/windows/generated-sdk/evidence.json -Raw | ConvertFrom-Json
          $linuxSdk = Get-Content artifacts/cross/linux/generated-sdk/evidence.json -Raw | ConvertFrom-Json
          foreach ($pair in @(@($windowsSdk, $windows), @($linuxSdk, $linux))) {
            $sdk = $pair[0]; $smoke = $pair[1]
            if ($sdk.status -cne 'passed' -or $sdk.modelsCli -cne 'passed' -or $sdk.sdkComposition -cne 'passed' -or
                $sdk.generatedSourceCount -ne 852 -or $sdk.regressionProjects.Count -ne 7 -or
                $sdk.regressionCounts.failed -ne 0 -or $sdk.regressionCounts.passed -le 0 -or
                @($sdk.gates.PSObject.Properties | Where-Object { $_.Value -cne 'passed' }).Count) {
              throw 'Fresh generated SDK build/runtime evidence is incomplete.'
            }
            foreach ($gate in @('installedToolInputs', 'cleanSourceStage', 'sdkCompositionRegression', 'generatedInputsUnchanged')) {
              if ($sdk.gates.$gate -cne 'passed') { throw "Fresh SDK gate missing or failed: $gate" }
            }
            foreach ($field in @('packageSha256', 'fhirPackageSha256', 'primitivePolicySha256', 'packageId', 'toolVersion', 'targetFramework')) {
              if ($sdk.$field -cne $smoke.$field) { throw "SDK/tool smoke provenance mismatch: $field" }
            }
          }
          if ([string]::IsNullOrWhiteSpace($windowsSdk.compilerReferenceSha256) -or
              $windowsSdk.compilerReferenceSha256 -cne $linuxSdk.compilerReferenceSha256) { throw 'SDK canonical compiler reference mismatch.' }
          foreach ($hostName in @('windows', 'linux')) {
            $generated = Get-Content "artifacts/cross/$hostName/generated-sdk/artifact-hashes.txt" -Raw
            $smokeHashes = Get-Content "artifacts/cross/$hostName/canonical-smoke/artifact-hashes.txt" -Raw
            if ($generated -cne $smokeHashes) { throw "SDK did not consume tool smoke sources: $hostName" }
          }
          ./eng/Compare-CodeGenToolArtifacts.ps1 `
            -WindowsPackageInventory artifacts/cross/windows/package-inventory.txt `
            -LinuxPackageInventory artifacts/cross/linux/package-inventory.txt `
            -WindowsArtifactHashes artifacts/cross/windows/canonical-smoke/artifact-hashes.txt `
            -LinuxArtifactHashes artifacts/cross/linux/canonical-smoke/artifact-hashes.txt `
            -OutputPath artifacts/cross/canonical-cross-platform-drift.json
          . ./eng/KernelMigration.Common.ps1
          Write-KernelJson artifacts/cross/generated-sdk-cross-platform-drift.json ([ordered]@{
            schemaVersion = 1; status = 'passed'
            packageSha256 = $windowsSdk.packageSha256
            compilerReferenceSha256 = $windowsSdk.compilerReferenceSha256
            generatedSourceCount = 852
            windows = [ordered]@{ modelsCli = $windowsSdk.modelsCli; sdkComposition = $windowsSdk.sdkComposition; regressionCounts = $windowsSdk.regressionCounts; externalClientSmoke = $windowsSdk.externalClientSmoke }
            linux = [ordered]@{ modelsCli = $linuxSdk.modelsCli; sdkComposition = $linuxSdk.sdkComposition; regressionCounts = $linuxSdk.regressionCounts; externalClientSmoke = $linuxSdk.externalClientSmoke }
          })

      - name: Upload cross-platform report
        uses: actions/upload-artifact@v4
        with:
          name: d7-cross-platform-drift
          path: artifacts/cross/*cross-platform-drift.json
          if-no-files-found: error
